<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Galeria</title>
    <script src="../components/layout.js" defer></script>
    <link rel="stylesheet" href="../css/galeria.css">
</head>
<body>
    <nav id="navbar"></nav>

    <main>
    <section id="banner-carrosel">

    <img id="imagem-fundo" 
        src="" 
        alt="">

    <img id="imagem-banner"
        src=""
        alt="Imagem em destaque">

    <h2 id="titulo-banner"></h2>

    <button id="seta-anterior"
        class="seta-banner"
        type="button"
        aria-label="Imagem anterior">
        &#10094;
    </button>
    <button id="seta-proxima"
        class="seta-banner"
        type="button"
        aria-label="Próxima imagem">
        &#10095;
    </button>
    </section>

    <section id="midia">
        <div id="midia-container">
        <h1>Mídias</h1>
        <div id="galeria"></div>
        </div>
    </section>

    <button id="botao" type="button">Upload Mídia</button>

    <input
    type="file"
    id="arquivo-midia"
    accept="image/png,image/jpeg,image/webp,image/gif"
    hidden>
    </main>

    <script src="../components/fotos.js"></script>
    <script src="../components/galeria.js"></script>
    <div id="rodape"></div>

    <div id="aviso-upload" role="status" aria-live="polite">
        <span id="mensagem-aviso"></span>
    </div>
</body>
</html>
